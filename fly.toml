# `app` is set by `fly launch --no-deploy`.
app = "your-thread-app"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  THREAD_HOST = "0.0.0.0"
  THREAD_PORT = "8080"
  THREAD_PUBLIC_URL = "https://your-thread-app.fly.dev"
  THREAD_DATA_DIR = "/data"
  THREAD_CONFIG_DIR = "/data/config"

[[mounts]]
  source = "thread_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

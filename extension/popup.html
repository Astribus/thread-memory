<!doctype html><html><head><meta charset="utf-8"><title>Thread Backup</title>
<style>
  :root { --bg:#f7f6f3; --ink:#2f3437; --muted:#787774; --hair:#e4e2dd; --good:#3f7a5a; --bad:#9f2f2d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191919; --ink:#e6e6e4; --muted:#9b9a97; --hair:#2f2f2f; --good:#7fbf98; --bad:#e07a76; } }
  body { margin:0; width:320px; padding:18px; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  h1 { font:400 24px/1 "New York", Georgia, serif; margin:0 0 6px; }
  p { margin:0 0 14px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; }
  input { width:100%; box-sizing:border-box; height:36px; padding:0 10px; font:inherit; color:var(--ink);
          background:transparent; border:1px solid var(--hair); border-radius:6px; }
  button { margin-top:16px; width:100%; height:36px; border:0; border-radius:6px; font:600 13px inherit;
           background:var(--ink); color:var(--bg); cursor:pointer; }
  #status { margin:16px 0 0; padding-top:14px; border-top:1px solid var(--hair); font-size:13px; }
  .ok { color:var(--good); } .bad { color:var(--bad); }
</style></head><body>
  <h1>Thread</h1>
  <p>Keeps a copy of your ChatGPT and Claude chats in your Thread for 10 days.</p>
  <label for="thread">Your Thread address</label>
  <input id="thread" placeholder="https://your-thread.fly.dev" spellcheck="false">
  <label for="key">Backup key (Thread → Me → Chats)</label>
  <input id="key" type="password" placeholder="thr_…" spellcheck="false">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body></html>
